name: crossing-sync

on:
  schedule:
    # 每小时的第 7 分钟跑（避开整点的排队高峰）
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉留言 / 渲染页面
        run: node scripts/build.mjs

      - name: 提交变更
        run: |
          git config user.name "dafeiyu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有变化，跳过"
          else
            git commit -m "渡口同步 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
